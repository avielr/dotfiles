# Sensible defaults
set -g mouse on
setw -g history-limit 10000

# Reduce flickering (synchronized output + passthrough for TUI apps)
set -g allow-passthrough on
set -gq terminal-features ',xterm-256color:sync'

# Show CWD in pane title and status bar
set -g pane-border-status top
set -g pane-border-format " #{pane_current_path} "
set -g status-right " #{pane_current_path} "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Continuum options
set -g @continuum-restore 'on'

# FZF reverse search (prefix + /)
bind-key / run-shell "tmux capture-pane -J -S -3000; tmux save-buffer /tmp/tmux_buffer; tmux new-window 'fzf < /tmp/tmux_buffer'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
